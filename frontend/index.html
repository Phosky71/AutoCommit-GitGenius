<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Commit</title>
    <style>
        :root {
            --bg: #0f0f11;
            --surface: #1a1a1f;
            --surface-2: #222228;
            --border: #2e2e38;
            --text: #e8e8ed;
            --text-muted: #8a8a9a;
            --accent: #7c6af7;
            --accent-hover: #9585fa;
            --success: #4caf86;
            --error: #e06c75;
            --warning: #e5c07b;
            --radius: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            line-height: 1.5;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text);
        }

        h1 span { color: var(--accent); }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 14px;
        }

        .card-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
            margin-top: 10px;
        }
        label:first-of-type { margin-top: 0; }

        input, select {
            width: 100%;
            padding: 8px 10px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 13px;
            outline: none;
            transition: border-color 0.15s;
        }
        input:focus, select:focus { border-color: var(--accent); }
        input[type="password"] { letter-spacing: 0.1em; }

        .provider-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 12px;
        }

        .provider-btn {
            padding: 7px 10px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            text-align: left;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .provider-btn:hover { border-color: var(--accent); color: var(--text); }
        .provider-btn.active {
            border-color: var(--accent);
            background: rgba(124, 106, 247, 0.12);
            color: var(--text);
        }
        .provider-btn .badge {
            font-size: 9px;
            padding: 1px 5px;
            border-radius: 3px;
            margin-left: auto;
        }
        .badge.local { background: rgba(76, 175, 134, 0.2); color: var(--success); }
        .badge.cloud { background: rgba(229, 192, 123, 0.2); color: var(--warning); }

        .key-required {
            font-size: 11px;
            color: var(--warning);
            margin-top: 6px;
            display: none;
        }
        .key-required.show { display: block; }

        .row { display: flex; gap: 8px; }
        .row input { flex: 1; }

        .btn {
            padding: 9px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.15s;
            width: 100%;
            margin-top: 8px;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }
        .btn-outline:hover { border-color: var(--accent); color: var(--text); }
        .btn-danger { background: rgba(224, 108, 117, 0.15); border: 1px solid var(--error); color: var(--error); }
        .btn-danger:hover { background: rgba(224, 108, 117, 0.25); }
        .btn-sm { padding: 6px 12px; font-size: 12px; width: auto; margin-top: 0; }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            cursor: pointer;
        }
        .checkbox-row input[type="checkbox"] { width: auto; accent-color: var(--accent); }
        .checkbox-row span { font-size: 13px; color: var(--text-muted); }

        .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
        .actions-grid .btn { margin-top: 0; }

        #status-box {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 12px;
            font-family: 'Cascadia Code', 'Consolas', monospace;
            color: var(--text-muted);
            min-height: 44px;
            max-height: 120px;
            overflow-y: auto;
            margin-top: 8px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .status-ok { color: var(--success); }
        .status-err { color: var(--error); }
        .status-info { color: var(--accent); }

        .divider { border: none; border-top: 1px solid var(--border); margin: 4px 0 12px; }

        .timer-status {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 8px;
        }
        .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
        }
        .dot.running {
            background: var(--success);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
<h1>⚡ Auto <span>Commit</span></h1>

<!-- PROVIDER SELECTOR -->
<div class="card">
    <div class="card-title">🤖 LLM Provider</div>
    <div class="provider-grid" id="provider-grid">
        <button class="provider-btn active" data-provider="lm_studio" onclick="selectProvider(this)">
            🖥️ LM Studio <span class="badge local">local</span>
        </button>
        <button class="provider-btn" data-provider="ollama" onclick="selectProvider(this)">
            🦙 Ollama <span class="badge local">local</span>
        </button>
        <button class="provider-btn" data-provider="local_ai" onclick="selectProvider(this)">
            🔧 LocalAI <span class="badge local">local</span>
        </button>
        <button class="provider-btn" data-provider="custom" onclick="selectProvider(this)">
            ⚙️ Custom <span class="badge local">local</span>
        </button>
        <button class="provider-btn" data-provider="open_ai" onclick="selectProvider(this)">
            ✦ OpenAI <span class="badge cloud">cloud</span>
        </button>
        <button class="provider-btn" data-provider="groq" onclick="selectProvider(this)">
            ⚡ Groq <span class="badge cloud">cloud</span>
        </button>
        <button class="provider-btn" data-provider="gemini" onclick="selectProvider(this)">
            ♊ Gemini <span class="badge cloud">cloud</span>
        </button>
        <button class="provider-btn" data-provider="anthropic" onclick="selectProvider(this)">
            ◆ Claude <span class="badge cloud">cloud</span>
        </button>
        <button class="provider-btn" data-provider="mistral" onclick="selectProvider(this)">
            🌬️ Mistral <span class="badge cloud">cloud</span>
        </button>
        <button class="provider-btn" data-provider="together" onclick="selectProvider(this)">
            🤝 Together <span class="badge cloud">cloud</span>
        </button>
        <button class="provider-btn" data-provider="open_router" onclick="selectProvider(this)">
            🔀 OpenRouter <span class="badge cloud">cloud</span>
        </button>
    </div>

    <label>Base URL</label>
    <input type="text" id="base-url" placeholder="http://localhost:1234/v1" />

    <label>Model Name</label>
    <input type="text" id="model-name" placeholder="model-name" />

    <label>API Key</label>
    <input type="password" id="api-key" placeholder="sk-... (leave empty for local)" />
    <p class="key-required" id="key-warning">⚠️ API key required for this provider</p>

    <button class="btn btn-outline btn-sm" style="margin-top:10px;" onclick="testConnection()">
        🔌 Test Connection
    </button>
</div>

<!-- REPOSITORY -->
<div class="card">
    <div class="card-title">📁 Repository</div>
    <label>Git Repository Path</label>
    <input type="text" id="repo-path" placeholder="C:\Users\you\project or /home/you/project" />
</div>

<!-- SETTINGS -->
<div class="card">
    <div class="card-title">⚙️ Auto-Commit Settings</div>
    <label>Interval (minutes)</label>
    <input type="number" id="interval" value="30" min="1" max="1440" />

    <label class="checkbox-row">
        <input type="checkbox" id="auto-start" />
        <span>Start automatically on app launch</span>
    </label>

    <button class="btn btn-outline btn-sm" style="margin-top:12px;" onclick="saveConfig()">
        💾 Save Config
    </button>
</div>

<!-- ACTIONS -->
<div class="card">
    <div class="card-title">🎯 Actions</div>
    <div class="actions-grid">
        <button class="btn btn-primary" onclick="manualCommit()">⚡ Manual Commit</button>
        <button class="btn btn-outline" id="btn-start" onclick="startAuto()">▶ Start Auto</button>
    </div>
    <button class="btn btn-danger" id="btn-stop" onclick="stopAuto()" style="display:none;">
        ⏹ Stop Auto-Commit
    </button>

    <div class="timer-status">
        <div class="dot" id="status-dot"></div>
        <span id="timer-label">Idle</span>
    </div>

    <div id="status-box">Ready.</div>
</div>

<script type="module">
    import { invoke } from 'https://unpkg.com/@tauri-apps/api@2/core';
    import { listen } from 'https://unpkg.com/@tauri-apps/api@2/event';

    // ---- PROVIDER DEFAULTS ----
    const PROVIDER_DEFAULTS = {
        lm_studio:   { url: 'http://localhost:1234/v1',                                      model: 'local-model' },
        ollama:      { url: 'http://localhost:11434/v1',                                     model: 'llama3.2' },
        local_ai:    { url: 'http://localhost:8080/v1',                                      model: 'gpt-4' },
        custom:      { url: 'http://localhost:8000/v1',                                      model: 'local-model' },
        open_ai:     { url: 'https://api.openai.com/v1',                                    model: 'gpt-4o-mini' },
        groq:        { url: 'https://api.groq.com/openai/v1',                               model: 'llama-3.3-70b-versatile' },
        gemini:      { url: 'https://generativelanguage.googleapis.com/v1beta/openai',      model: 'gemini-2.0-flash' },
        anthropic:   { url: 'https://api.anthropic.com/v1',                                 model: 'claude-3-5-haiku-20241022' },
        mistral:     { url: 'https://api.mistral.ai/v1',                                    model: 'mistral-small-latest' },
        together:    { url: 'https://api.together.xyz/v1',                                  model: 'meta-llama/Llama-3-8b-chat-hf' },
        open_router: { url: 'https://openrouter.ai/api/v1',                                 model: 'openai/gpt-4o-mini' },
    };

    const CLOUD_PROVIDERS = new Set(['open_ai', 'groq', 'gemini', 'anthropic', 'mistral', 'together', 'open_router']);

    let currentProvider = 'lm_studio';

    // ---- UI HELPERS ----
    const $ = id => document.getElementById(id);

    function setStatus(msg, type = 'info') {
        const box = $('status-box');
        box.textContent = msg;
        box.className = 'status-' + type;
    }

    function setTimerRunning(running) {
        $('status-dot').classList.toggle('running', running);
        $('timer-label').textContent = running ? 'Auto-commit running…' : 'Idle';
        $('btn-start').style.display = running ? 'none' : '';
        $('btn-stop').style.display  = running ? '' : 'none';
    }

    // ---- PROVIDER SELECTION ----
    window.selectProvider = function(btn) {
        document.querySelectorAll('.provider-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentProvider = btn.dataset.provider;

        const defaults = PROVIDER_DEFAULTS[currentProvider];
        $('base-url').value   = defaults.url;
        $('model-name').value = defaults.model;

        const needsKey = CLOUD_PROVIDERS.has(currentProvider);
        $('key-warning').classList.toggle('show', needsKey);
    };

    // ---- LOAD CONFIG ----
    async function loadConfig() {
        try {
            const cfg = await invoke('load_config_from_file');
            if (cfg.provider) {
                currentProvider = cfg.provider;
                const btn = document.querySelector(`[data-provider="${cfg.provider}"]`);
                if (btn) {
                    document.querySelectorAll('.provider-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                }
                const needsKey = CLOUD_PROVIDERS.has(currentProvider);
                $('key-warning').classList.toggle('show', needsKey);
            }
            $('base-url').value   = cfg.llm_base_url   || '';
            $('model-name').value = cfg.llm_model_name || '';
            $('api-key').value    = cfg.llm_api_key    || '';
            $('repo-path').value  = cfg.repo_path      || '';
            $('interval').value   = cfg.interval_minutes || 30;
            $('auto-start').checked = cfg.auto_start || false;

            if (cfg.auto_start && cfg.repo_path) {
                await startAuto();
            }
            setStatus('Config loaded.', 'ok');
        } catch (e) {
            setStatus('No config found, using defaults.', 'info');
        }
    }

    // ---- SAVE CONFIG ----
    window.saveConfig = async function() {
        try {
            await invoke('save_config', {
                config: {
                    provider:           currentProvider,
                    llm_base_url:       $('base-url').value.trim(),
                    llm_model_name:     $('model-name').value.trim(),
                    llm_api_key:        $('api-key').value.trim(),
                    repo_path:          $('repo-path').value.trim(),
                    interval_minutes:   parseInt($('interval').value) || 30,
                    auto_start:         $('auto-start').checked,
                    auto_commit_enabled: false,
                }
            });
            setStatus('Config saved ✓', 'ok');
        } catch (e) {
            setStatus('Error saving config: ' + e, 'err');
        }
    };

    // ---- TEST CONNECTION ----
    window.testConnection = async function() {
        setStatus('Testing connection…', 'info');
        try {
            const result = await invoke('test_connection', {
                provider:  currentProvider,
                baseUrl:   $('base-url').value.trim(),
                model:     $('model-name').value.trim(),
                apiKey:    $('api-key').value.trim(),
            });
            setStatus('✓ ' + result, 'ok');
        } catch (e) {
            setStatus('✗ ' + e, 'err');
        }
    };

    // ---- MANUAL COMMIT ----
    window.manualCommit = async function() {
        const path = $('repo-path').value.trim();
        if (!path) { setStatus('Please set a repository path first.', 'err'); return; }
        setStatus('Running commit…', 'info');
        try {
            const msg = await invoke('run_commit', { path });
            setStatus(msg === 'No changes to commit' ? 'No changes to commit.' : '✓ ' + msg, msg === 'No changes to commit' ? 'info' : 'ok');
        } catch (e) {
            setStatus('✗ ' + e, 'err');
        }
    };

    // ---- AUTO COMMIT ----
    window.startAuto = async function() {
        await saveConfig();
        try {
            await invoke('start_auto_commit');
            setTimerRunning(true);
            setStatus('Auto-commit started.', 'ok');
        } catch (e) {
            setStatus('✗ ' + e, 'err');
        }
    };

    window.stopAuto = async function() {
        try {
            await invoke('stop_auto_commit');
            setTimerRunning(false);
            setStatus('Auto-commit stopped.', 'info');
        } catch (e) {
            setStatus('✗ ' + e, 'err');
        }
    };

    // ---- EVENTS FROM BACKEND ----
    listen('commit-status', e => setStatus('✓ ' + e.payload, 'ok'));
    listen('commit-error',  e => setStatus('✗ ' + e.payload, 'err'));

    // ---- INIT ----
    loadConfig();
</script>
</body>
</html>
