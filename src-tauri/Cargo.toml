[package]
name = "auto_commit_app"
version = "1.1.1"
edition = "2021"

[dependencies]
tauri = { version = "=2.10.3", features = ["devtools"] }
tauri-plugin-dialog = { version = "=2.7.1" }
tauri-runtime = { version = "=2.10.1" }
tauri-runtime-wry = { version = "=2.10.1" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.48.0", features = ["full"] }
reqwest = { version = "0.13.4", features = ["json"] }
dirs = "6.0.0"
once_cell = "1.21.3"

[build-dependencies]
tauri-build = { version = "=2.6.2", features = [] }
